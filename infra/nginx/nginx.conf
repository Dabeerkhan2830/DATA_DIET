# DataDiet — Nginx reverse proxy (future deployment configuration).
#
# This file is the starting point for the deployed topology that the DataDiet
# architecture calls for: Nginx serves the built React bundle and proxies API
# traffic to the FastAPI application. It is NOT used during local development
# (Flask-less setup: Vite dev server proxies /api to the backend instead).
#
# Values marked PLACEHOLDER must be replaced for a real environment, along with
# TLS certificates and hardened headers.

upstream datadiet_backend {
    # Inside docker-compose the backend runs on the host.
    server host.docker.internal:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # --- Security headers (baseline; tighten for production) ----------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://datadiet_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API docs (disable or restrict in production)
    location /docs {
        proxy_pass http://datadiet_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://datadiet_backend;
        proxy_set_header Host $host;
    }

    # --- Static frontend ----------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
