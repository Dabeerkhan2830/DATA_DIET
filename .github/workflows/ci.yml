# DataDiet continuous integration (Phase 9, ADR-0019).
#
# Runs on every pull request and every push to main. The job is the Linux
# equivalent of scripts/check.ps1 (which remains the Windows PowerShell 5.1
# gate) and adds the disposable MySQL migration suite. No repository secret or
# production credential is used; the MySQL service is an ephemeral container
# whose only database is dropped and recreated by the test fixtures.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Disposable MySQL for the migration suite only. The empty root password
      # is CI-local and grants nothing outside this ephemeral container.
      mysql:
        # Digest verified against Docker Hub's registry for the multi-arch
        # mysql:8.4 manifest on 2026-10-21. Keep the tag for readability.
        image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: datadiet_ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.1"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint backend
        working-directory: backend
        run: python -m ruff check .

      - name: Lint operator scripts
        working-directory: backend
        run: python -m ruff check ../scripts

      - name: Backend tests
        working-directory: backend
        run: python -m pytest

      - name: MySQL migration integration tests (19 expected)
        working-directory: backend
        # The fixture in tests/test_migrations_mysql.py drops and recreates this
        # database, so it must only ever point at the disposable service above.
        # The explicit guard also fails if the URL disappears or if every test
        # is skipped, which would otherwise make this step silently useless.
        env:
          MIGRATION_TEST_DB_URL: mysql+pymysql://root@127.0.0.1:3306/datadiet_ci
          MIGRATION_TEST_ALLOW_DROP: "1"
          MIGRATION_TEST_EXPECTED_TESTS: "19"
        run: |
          set -euo pipefail
          : "${MIGRATION_TEST_DB_URL:?MIGRATION_TEST_DB_URL must be set for the MySQL migration suite}"
          : "${MIGRATION_TEST_ALLOW_DROP:?MIGRATION_TEST_ALLOW_DROP must be 1}"
          expected="${MIGRATION_TEST_EXPECTED_TESTS:?expected test count must be set}"
          log="$RUNNER_TEMP/mysql-migration-tests.log"
          python -m pytest tests/test_migrations_mysql.py -rs | tee "$log"
          grep -Eq "${expected} passed" "$log" || {
            echo "::error::expected ${expected} MySQL migration tests to pass; see the pytest output above"
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend type check
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend production build
        working-directory: frontend
        run: npm run build
