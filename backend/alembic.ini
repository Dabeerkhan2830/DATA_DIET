# Alembic configuration for DataDiet.
#
# Run alembic from the backend/ directory:
#   ..\.venv\Scripts\alembic upgrade head      (PowerShell, repo root)
# or from backend/:  ..\.venv\Scripts\alembic upgrade head
#
# The database URL is supplied at runtime by database/migrations/env.py from
# the DATABASE_URL environment variable (see .env.example) — credentials are
# never committed to this file.

[alembic]
script_location = ../database/migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder only; env.py overrides this from Settings/DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
